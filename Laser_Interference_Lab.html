<title>Laser Interference Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: instrument-rack shell. A left rail lists the experiments in two tiers; the bench schematic sits on an
   optical-breadboard hole grid; detector output below it; readouts and controls in a right column. */
:root{
  --bg:#e8ebef; --surface:#f4f6f8; --raised:#ffffff; --ink:#131820; --muted:#566070; --line:#c8cfd8;
  --bench:#dde1e7; --hole:#b4bcc8;
  --red:#cc1a2a; --violet:#5a32d4; --accent:var(--red);
  --screen:#06080b;
  --ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0e13; --surface:#11151c; --raised:#1a202a; --ink:#e7eaef; --muted:#8d97a6; --line:#2a313c;
    --bench:#0e1218; --hole:#252c37; --red:#ff4d5b; --violet:#a78bff; --screen:#030406; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e13; --surface:#11151c; --raised:#1a202a; --ink:#e7eaef; --muted:#8d97a6; --line:#2a313c;
  --bench:#0e1218; --hole:#252c37; --red:#ff4d5b; --violet:#a78bff; --screen:#030406; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:1320px;margin-inline:auto;padding-inline:20px;padding-block:18px 56px;
  display:grid;grid-template-columns:228px minmax(0,1fr);column-gap:32px;row-gap:22px}
.app[data-tier="photon"]{--accent:var(--violet)}

.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px}
.fringe{width:34px;height:16px;border-radius:1px;
  background:repeating-linear-gradient(90deg,var(--accent) 0 3px,transparent 3px 6.8px)}
.top h1{font:700 1.2rem/1 var(--ui);margin:0}
.top p{margin:0;color:var(--muted);font-size:.93rem}

.rail{display:flex;flex-direction:column;gap:22px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}
.grp{display:flex;flex-direction:column;gap:2px}
.grp h2{font:600 .7rem/1.2 var(--ui);letter-spacing:.09em;text-transform:uppercase;margin:0;color:var(--ink);display:flex;align-items:center;gap:8px}
.grp h2::before{content:"";width:9px;height:9px;background:var(--g)}
.grp .sub{margin:3px 0 8px;font-size:.82rem;color:var(--muted)}
.grp button{font:500 .93rem/1.25 var(--ui);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:3px;
  padding:7px 10px;text-align:left;cursor:pointer}
.grp button:hover{background:var(--surface)}
.grp button[aria-current="true"]{background:var(--ink);color:var(--bg);font-weight:600}

main{display:flex;flex-direction:column;gap:20px;min-width:0}
.eyebrow{font:600 .72rem/1.2 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.head h2{font:700 clamp(1.5rem,2.6vw,2.05rem)/1.12 var(--ui);margin:0 0 8px;text-wrap:balance;letter-spacing:-.01em}
.head .lead{font:400 1.08rem/1.5 var(--serif);max-width:64ch;margin:0}

.work{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:22px;align-items:start}
.views{display:flex;flex-direction:column;gap:14px;min-width:0}
figure{margin:0}
.view{border:1px solid var(--line);background:var(--surface);border-radius:3px;overflow:hidden;min-width:0}
.view figcaption{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 14px;padding:8px 12px;border-bottom:1px solid var(--line);
  font:600 .7rem/1.3 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.view figcaption span+span{font-weight:400;letter-spacing:.02em;text-transform:none;font-size:.8rem}
.scroll{overflow-x:auto}
#bench{display:block;width:100%;min-width:600px;aspect-ratio:1000/420}
#out{display:block;width:100%;height:280px}

.side{display:flex;flex-direction:column;gap:20px;min-width:0}
.readouts{margin:0;border-top:1px solid var(--line)}
.readouts div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.readouts dt{color:var(--muted);font-size:.86rem}
.readouts dd{margin:0;font:500 .98rem var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

.controls{display:flex;flex-direction:column;gap:15px}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.88rem;font-weight:500}
.ctl .val{font-family:var(--mono);font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ctl input[type=range]{display:block;width:100%;accent-color:var(--accent);margin:6px 0 0}
.off{opacity:.42}
.sw{display:flex;gap:9px;align-items:center;font-size:.9rem;font-weight:500;cursor:pointer}
.sw input{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none}
.seg{border:0;padding:0;margin:0;min-width:0}
.seg legend{font-size:.88rem;font-weight:500;padding:0;margin-bottom:6px}
.seg .opts{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg label{flex:1 1 auto;text-align:center;cursor:pointer;position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0}
.seg span{display:block;padding:7px 10px;font-size:.85rem;background:var(--raised)}
.seg input:checked+span{background:var(--ink);color:var(--bg);font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.b{font:600 .86rem var(--ui);padding:8px 14px;border-radius:3px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.b.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.b:disabled{cursor:default}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px 34px;border-top:1px solid var(--line);padding-top:20px}
.notes div{min-width:0}
.notes h3{font:600 .72rem/1.2 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.notes p{font:400 1rem/1.56 var(--serif);margin:0;max-width:62ch}

@media (max-width:1120px){
  .work{grid-template-columns:minmax(0,1fr)}
  .side{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px 28px}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);padding-inline:16px}
  .rail{position:static;flex-direction:row;gap:18px;overflow-x:auto;padding-bottom:8px}
  .grp{flex-direction:row;align-items:center;gap:4px;flex:none}
  .grp h2{margin-right:6px;white-space:nowrap}
  .grp .sub{display:none}
  .grp button{white-space:nowrap;border-color:var(--line)}
}
</style>

<div class="app" id="app" data-tier="laser">
  <header class="top">
    <div class="brand"><span class="fringe" aria-hidden="true"></span><h1>Laser Interference Lab</h1></div>
    <p>Ten simulated bench experiments, from a plain laser beam to entangled photon pairs.</p>
  </header>

  <nav class="rail" id="rail" aria-label="Experiments"></nav>

  <main>
    <section class="head">
      <p class="eyebrow" id="tier"></p>
      <h2 id="name"></h2>
      <p class="lead" id="lead"></p>
    </section>
    <div class="work">
      <div class="views">
        <figure class="view">
          <figcaption><span>Bench</span><span id="benchCap"></span></figcaption>
          <div class="scroll"><canvas id="bench" role="img" aria-label="Schematic of the optical bench"></canvas></div>
        </figure>
        <figure class="view">
          <figcaption><span>Detectors</span><span id="outCap"></span></figcaption>
          <canvas id="out" role="img" aria-label="Detector output"></canvas>
        </figure>
      </div>
      <aside class="side">
        <dl class="readouts" id="readouts"></dl>
        <form class="controls" id="controls"></form>
      </aside>
    </div>
    <section class="notes">
      <div><h3>What you are seeing</h3><p id="see"></p></div>
      <div><h3>Wave or quantum</h3><p id="why"></p></div>
      <div><h3>On a real bench</h3><p id="kit"></p></div>
    </section>
  </main>
</div>

<script>

/* ---------- bench drawing kit (virtual 1000 x 420 breadboard) ---------- */
function kit(g, W) {

    beam(pts, col, a = 1) {

    },

      if (!label) return; const o = s / 2 / k + 8;
      if (pos === 'r') b.text(x + o, y, label, 'left', C.ink, true); else if (pos === 'l') b.text(x - o, y, label, 'right', C.ink, true);
      else if (pos === 't') b.text(x, y - o - 6 / k, label, 'center', C.ink, true); else b.text(x, y + o + 6 / k, label, 'center', C.ink, true);
    },
    src(x, y, label) {
      g.save(); g.fillStyle = C.ink; g.fillRect(X(x - 38), Y(y - 15), 76 * k, 30 * k); g.fillRect(X(x + 38), Y(y - 6), 8 * k, 12 * k); g.restore();
      b.text(x, y + 15 + 14 / k * .9, label);

    box(x, y, w, h, label, col) {
      g.save(); g.fillStyle = col || C.raised; g.strokeStyle = C.ink; g.lineWidth = 1.4; g.fillRect(X(x - w / 2), Y(y - h / 2), w * k, h * k); g.strokeRect(X(x - w / 2), Y(y - h / 2), w * k, h * k); g.restore();

    },
    wire(pts) { g.save(); g.strokeStyle = C.muted; g.lineWidth = 1; g.setLineDash([3, 3]); P(pts); g.stroke(); g.restore(); },

/* ---------- plot helpers ---------- */
function axes(g, x, y, w, h, o) {

const LL = 1.2656;                      // wavelength x screen distance in mm^2: 632.8 nm at 2 m
const SLIT_W = 0.04, HALF = 20;         // slit width and half screen width, mm
function slitParts(p) {
  let a, b, c;
  if (!p.mark) { a = b = Math.SQRT1_2; c = 1; if (p.eras) { const q = Math.cos(rad(45 - p.tE)); a *= q; b *= q; } }
  else {
    a = Math.SQRT1_2 * Math.cos(rad(p.tA - 45)); b = Math.SQRT1_2 * Math.cos(rad(p.tB - 45)); c = Math.cos(rad(p.tA - p.tB));
    if (p.eras) { a *= Math.cos(rad(p.tA - p.tE)); b *= Math.cos(rad(p.tB - p.tE)); c = 1; }
  }
  const sum = a * a + b * b, cross = 2 * a * b * c;
  return { sum, cross, V: sum > 1e-9 ? Math.abs(cross) / sum : 0, D: p.mark ? Math.abs(Math.sin(rad(p.tA - p.tB))) : 0 };
}
const slitEnv = x => { const u = Math.PI * SLIT_W * x / LL; return u ? Math.pow(Math.sin(u) / u, 2) : 1; };
const slitI = (x, p, q) => slitEnv(x) * (q.sum + q.cross * Math.cos(TAU * p.d * x / LL)) / 2;
function drawSlits(b, p, q) {
  const y1 = 188, y2 = 232, thru = q.sum;
  b.beam([[106, 210], [296, 210]], C.red, 1);
  b.fan(304, y1, 884, 70, 350, C.red, .05 + .16 * thru); b.fan(304, y2, 884, 70, 350, C.red, .05 + .16 * thru);
  b.src(60, 210, 'Laser 632.8 nm'); b.slits(300, y1, y2); b.text(300, 26, 'Double slit');
  if (p.mark) {
    b.plate(328, y1, 90, 26, C.accent, 3); b.plate(328, y2, 90, 26, C.accent, 3);
    b.wire([[334, y1 - 14], [372, 132]]); b.wire([[334, y2 + 14], [372, 288]]);
    b.dial(385, 112, p.tA, 'A ' + p.tA + '°', 'r'); b.dial(385, 308, p.tB, 'B ' + p.tB + '°', 'r');
  }
  if (p.eras) { b.plate(640, 210, 90, 240, C.accent, 3); b.dial(640, 56, p.tE, 'Eraser ' + p.tE + '°', 'r'); }
  b.plate(886, 210, 90, 300, C.ink, 5); b.text(886, 384, 'Screen at 2 m');
}
const mmTicks = [[0, '−20'], [.25, '−10'], [.5, '0'], [.75, '10'], [1, '20']];

/* ---------- Mach-Zehnder, shared by two experiments ---------- */
const MZ = { S: [70, 300], B1: [250, 300], M1: [750, 300], M2: [250, 110], B2: [750, 110], DR: [905, 110], DU: [750, 40] };
MZ.low = [MZ.B1, MZ.M1, MZ.B2]; MZ.up = [MZ.B1, MZ.M2, MZ.B2];
function drawMZ(b, o) {
  const m = MZ, col = C.red;
  b.beam([[116, 300], m.B1], col, 1);
  if (o.block) b.beam([m.B1, [486, 300]], col, o.iLow); else b.beam(m.low, col, o.iLow);
  b.beam(m.up, col, o.iUp); b.beam([m.B2, [890, 110]], col, o.outR); b.beam([m.B2, [750, 56]], col, o.outU);
  b.src(70, 300, o.srcLabel); b.bs(250, 300); b.text(250, 344, 'BS1'); b.mirror(750, 300); b.mirror(250, 110);
  b.bs(750, 110, -45, o.bs2 !== false); b.text(730, 150, o.bs2Label || 'BS2', 'right');
  b.det(m.DR[0], m.DR[1], o.rLabel, o.rLvl, 'b'); b.det(m.DU[0], m.DU[1], o.uLabel, o.uLvl, 'r');
}

/* =================================================================== */
const TIERS = {
  laser: { title: 'Laser beam', sub: 'A plain laser is enough. Wave optics explains the result.', eyebrow: 'Laser beam · wave optics' },
  photon: { title: 'Photon counting', sub: 'Needs single photons or entangled pairs and coincidence counting.', eyebrow: 'Photon counting · single photons and pairs' }
};
const app = $('#app'), benchCv = $('#bench'), outCv = $('#out');
let cur = null, dirty = true, last = 0;

function buildNav() {
  const rail = $('#rail');
  for (const t of ['laser', 'photon']) {
    const grp = el('div', 'grp'); grp.style.setProperty('--g', `var(--${t === 'laser' ? 'red' : 'violet'})`);
    grp.append(el('h2', '', TIERS[t].title), el('p', 'sub', TIERS[t].sub));
    EXPS.filter(e => e.tier === t).forEach(e => { const bt = el('button', '', e.nav); bt.type = 'button'; bt.dataset.id = e.id; bt.addEventListener('click', () => mount(e.id)); grp.append(bt); });
    rail.append(grp);

}
function changed(exp, c) { if (c && c.clear && exp.reset) exp.reset(); exp._refresh(); dirty = true; }
function buildControls(exp) {
  const f = $('#controls'); f.textContent = ''; const refresh = [];

    const id = `c-${exp.id}-${c.key || 'b' + idx}`; let row;
    const gate = nodes => refresh.push(() => { const off = !!(c.when && !c.when(exp.s)); row.classList.toggle('off', off); nodes.forEach(n => { n.disabled = off; }); });
    if (c.type === 'range') {
      row = el('div', 'ctl'); const lab = el('label'); lab.htmlFor = id; const out = el('span', 'val'); lab.append(el('span', '', c.label), out);
      const inp = el('input'); inp.type = 'range'; inp.id = id; inp.min = c.min; inp.max = c.max; inp.step = c.step || 1; inp.value = exp.s[c.key];
      inp.addEventListener('input', () => { exp.s[c.key] = +inp.value; if (c.grab) exp.s[c.grab] = false; changed(exp, c); });
      refresh.push(() => { if (document.activeElement !== inp || exp.s[c.grab]) inp.value = exp.s[c.key]; out.textContent = c.fmt(exp.s[c.key]); });
      gate([inp]); row.append(lab, inp);
    } else if (c.type === 'check') {
      row = el('label', 'sw'); const inp = el('input'); inp.type = 'checkbox'; inp.id = id; inp.checked = exp.s[c.key];
      inp.addEventListener('change', () => { exp.s[c.key] = inp.checked; changed(exp, c); });
      refresh.push(() => { inp.checked = exp.s[c.key]; }); gate([inp]); row.append(inp, el('span', '', c.label));
    } else if (c.type === 'seg') {
      row = el('fieldset', 'seg'); row.append(el('legend', '', c.label)); const opts = el('div', 'opts'), ins = [];
      c.options.forEach(([v, t]) => { const l = el('label'), inp = el('input'); inp.type = 'radio'; inp.name = id; inp.id = id + '-' + v; inp.value = v; inp.checked = exp.s[c.key] === v;
        inp.addEventListener('change', () => { exp.s[c.key] = v; changed(exp, c); }); ins.push(inp); l.append(inp, el('span', '', t)); opts.append(l); });
      refresh.push(() => ins.forEach(i => { i.checked = exp.s[c.key] === i.value; })); gate(ins); row.append(opts);
    } else {
      row = el('div', 'btns'); const bs = [];

function showReadouts(exp) {

  rows.forEach((r, i) => { const d = dl.children[i]; if (d.firstChild.textContent !== r[0]) d.firstChild.textContent = r[0]; if (d.lastChild.textContent !== r[1]) d.lastChild.textContent = r[1]; });
}
function mount(id) {

  $('#tier').textContent = TIERS[exp.tier].eyebrow; $('#name').textContent = exp.name; $('#lead').textContent = exp.lead;

  buildControls(exp); dirty = true;
  try { history.replaceState(null, '', '#' + exp.id); } catch (e) { /* sandboxed frame: the hash is a convenience only */ }
}
function draw() {
  readColors();
  { const [g, W] = fit(benchCv); cur.bench(kit(g, W)); }
  { const [g, W, H] = fit(outCv, Math.round(cur.outH(outCv.clientWidth))); cur.out(g, W, H); }

}
function loop(t) {

  requestAnimationFrame(loop);

buildNav();
$('#controls').addEventListener('submit', e => e.preventDefault());
addEventListener('resize', () => { dirty = true; });
addEventListener('hashchange', () => { const id = location.hash.slice(1); if (cur && id && id !== cur.id && EXPS.some(e => e.id === id)) mount(id); });

})();
